name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: "4.0.2"
      SERVERPOD_PASSWORD_database: "5yxgG0JfiwKysOpepCQU5Q--FxCFUUPQ"
      SERVERPOD_PASSWORD_redis: "KL1gEUGL1gyQo4eVRU73AupcxbOrHo-Z"

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"

      - name: Start containers
        working-directory: sip_sync_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart install serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: sip_sync_server
        run: serverpod generate

      - name: Run tests
        working-directory: sip_sync_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: sip_sync_server
        run: docker compose down -v
