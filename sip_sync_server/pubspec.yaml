name: sip_sync_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: "^3.12.2"

resolution: workspace

dependencies:
  bcrypt: ^1.2.0
  crypto: ^3.0.7
  sealed_countries: ^3.4.0
  serverpod: 4.0.4
  serverpod_auth_idp_server: 4.0.4
  serverpod_cloud_storage: 4.0.4

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  serverpod_test: 4.0.4
  test: ^1.25.5

serverpod:
  scripts:
    # Build the three Flutter web apps into the server's web directory.
    # Customer is served at /, management at /managment/, backoffice at /backoffice/.
    # The base href must match that prefix so GoRouter ignores it.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & (if exist web\managment rmdir /S /Q web\managment)
        & (if exist web\backoffice rmdir /S /Q web\backoffice)
        & cd /D ..\sip_sync_flutter
        & (call flutter build web --base-href / || (flutter clean && call flutter build web --base-href /))
        && xcopy /E /I /Y build\web ..\sip_sync_server\web\app
        & cd /D ..\managment
        & (call flutter build web --base-href /managment/ || (flutter clean && call flutter build web --base-href /managment/))
        && xcopy /E /I /Y build\web ..\sip_sync_server\web\managment
        & cd /D ..\backoffice
        & (call flutter build web --base-href /backoffice/ || (flutter clean && call flutter build web --base-href /backoffice/))
        && xcopy /E /I /Y build\web ..\sip_sync_server\web\backoffice
      posix: |
        build_web() {
          local app_dir="$1"
          local base_href="$2"
          local out_dir="$3"
          rm -rf "$out_dir"
          (
            cd "$app_dir"
            set -- web --base-href "$base_href" --output "$out_dir"
            flutter build "$@" || { flutter clean && flutter build "$@"; }
          )
        }
        server_dir="$(pwd)"
        build_web ../sip_sync_flutter / "$server_dir/web/app"
        build_web ../managment /managment/ "$server_dir/web/managment"
        build_web ../backoffice /backoffice/ "$server_dir/web/backoffice"

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R), keyed
  # by a display alias. The default device is the web server, opening the
  # machine's default browser when ready. All non-reserved properties are
  # forwarded to `flutter run`. For the best IDE debugging experience, use
  # `chrome` or a native target as the device. See the example below:
  #
  # Admin:
  #   path: ../apps/admin_flutter
  #   displayName: "Admin app"
  #   auto_launch: true
  #   device: chrome
  #   target: lib/main.dart
  #   web-hostname: 0.0.0.0
  #   web-port: 8090
  #   release: true
  #   pub: false
  #   dart-define:
  #     API_URL=https://admin.example.com
  #     FLAVOR=production
  flutter_apps:
    sip_sync:
      path: ../sip_sync_flutter
      displayName: "Customer app"
      auto_launch: true
      target: lib/driver.dart
      web-port: 8090
    managment:
      path: ../managment
      displayName: "Management app"
      auto_launch: true
      target: lib/driver.dart
      web-port: 8091
    backoffice:
      path: ../backoffice
      displayName: "Backoffice app"
      auto_launch: true
      target: lib/driver.dart
      web-port: 8092
