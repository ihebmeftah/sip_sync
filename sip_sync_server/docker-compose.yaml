services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: sip_sync
      POSTGRES_PASSWORD: "DrbAj3wCWvAKB3vRw0rqHcXg4NKBTDqo"
    volumes:
      - sip_sync_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "drsiOE9IG8kPHTxFq1e0m6fYKh6SqhNB"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: sip_sync_test
      POSTGRES_PASSWORD: "5yxgG0JfiwKysOpepCQU5Q--FxCFUUPQ"
    volumes:
      - sip_sync_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "KL1gEUGL1gyQo4eVRU73AupcxbOrHo-Z"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  sip_sync_data:
  sip_sync_test_data:
