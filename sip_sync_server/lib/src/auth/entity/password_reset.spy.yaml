### One-time owner password reset codes (hashed). Email delivery TBD — code is logged in development.
class: PasswordReset
table: password_reset
serverOnly: true
fields:
  id: UuidValue?, defaultPersist=random_v7
  email: String
  codeHash: String
  expiresAt: DateTime
  consumedAt: DateTime?
  createdAt: DateTime, defaultModel=now
indexes:
  password_reset_email_idx:
    fields: email
