### Links an employee identity to the owner who added them and the venue they work at.
class: EmployeeRecord
table: employee_record
serverOnly: true
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  ownerAuthUserId: UuidValue
  building: Building?, relation(name=building_employees, onDelete=Cascade)
  isEnabled: bool, default=true
indexes:
  employee_record_auth_user_idx:
    fields: authUserId
    unique: true
  employee_record_owner_idx:
    fields: ownerAuthUserId
  employee_record_building_idx:
    fields: buildingId
