### Additive app role for one [AuthUser]. A person may have several rows.
class: UserRoleMembership
table: user_role_membership
serverOnly: true
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  role: AppRole
indexes:
  user_role_membership_auth_role_idx:
    fields: authUserId, role
    unique: true
