### Staff assigned to one building. The employee must already belong to the owner.
class: BuildingStaff
table: building_staff
serverOnly: true
fields:
  id: UuidValue?, defaultPersist=random_v7
  building: Building?, relation(onDelete=Cascade)
  employeeAuthUserId: UuidValue
indexes:
  building_staff_unique:
    fields: buildingId, employeeAuthUserId
    unique: true
