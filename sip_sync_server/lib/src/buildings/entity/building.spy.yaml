### A café, restaurant, lounge, bar, or custom venue owned by one owner.
class: Building
table: building
serverOnly: true
fields:
  id: UuidValue?, defaultPersist=random_v7
  owner: Owner?, relation(name=owner_buildings, onDelete=Cascade)
  name: String
  type: String
  address: String
  latitude: double
  longitude: double
  openingMinutes: int
  closingMinutes: int
  currencyCode: String
  ### Venue contact phone in E.164 (`+216…`).
  phoneNumber: String
  ### ISO 3166-1 alpha-2 derived from [phoneNumber] dial code.
  countryCode: String
  ### Optional WhatsApp number (E.164) or empty.
  whatsapp: String?
  ### Instagram handle or profile URL.
  instagram: String?
  ### Facebook page URL or handle.
  facebook: String?
  ### Extra website / social URLs.
  otherLinks: List<String>
  ### When false, a table with an open (progress) order cannot receive another order.
  tableMultiOrder: bool, defaultModel=false
  ### When false, staff cannot append articles to an existing open order.
  allowAppendingItemsToOrder: bool, defaultModel=true
  ### When true, item status must follow enabled [strictModeSteps] in rank order.
  strictMode: bool, defaultModel=false
  ### Fixed pipeline steps (picked → … → payed); enable/disable only, no reorder.
  strictModeSteps: List<StrictModeStep>
  createdAt: DateTime, defaultModel=now
  employees: List<Employee>?, relation(name=building_employees)
  accessProfiles: List<EmployeeAccess>?, relation(name=building_access_profiles)
  tables: List<VenueTable>?, relation(name=building_tables)
  menuCategories: List<MenuCategory>?, relation(name=building_menu_categories)
  menuArticles: List<MenuArticle>?, relation(name=building_menu_articles)
  ingredients: List<Ingredient>?, relation(name=building_ingredients)
  orders: List<VenueOrder>?, relation(name=building_orders)
  ### Plan this venue is on. Create assigns the free pack.
  pack: Pack?, relation(name=building_pack, onDelete=Restrict)
indexes:
  building_owner_idx:
    fields: ownerId
