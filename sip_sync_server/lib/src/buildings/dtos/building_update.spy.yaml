class: BuildingUpdate
fields:
  id: UuidValue
  name: String
  type: String
  address: String
  latitude: double
  longitude: double
  openingMinutes: int
  closingMinutes: int
  currencyCode: String
  phoneNumber: String
  whatsapp: String?
  instagram: String?
  facebook: String?
  otherLinks: List<String>
  tableMultiOrder: bool
  allowAppendingItemsToOrder: bool
  strictMode: bool
  strictModeSteps: List<StrictModeStep>
  reservationFee: double, defaultModel=0
  ### When false, customers cannot place or append orders.
  customerOrderingEnabled: bool, defaultModel=true
  ### When false, reservations cannot be created.
  reservationsEnabled: bool, defaultModel=true
  ### When true, an order may be placed even if a recipe ingredient would go below zero.
  allowOutOfStockOrders: bool, defaultModel=false
