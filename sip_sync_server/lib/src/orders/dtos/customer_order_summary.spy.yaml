### One of the signed-in customer's orders, without the dish lines.
class: CustomerOrderSummary
fields:
  id: UuidValue
  buildingId: UuidValue
  venueName: String
  ref: int
  tableNumber: int
  currencyCode: String
  status: OrderStatus
  ### Set when the venue cancelled the whole order.
  cancellationReason: OrderCancellationReason?
  itemCount: int
  totalAmount: double
  createdAt: DateTime
