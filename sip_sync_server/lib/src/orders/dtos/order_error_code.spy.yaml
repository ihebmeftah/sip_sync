enum: OrderErrorCode
serialized: byName
values:
  - invalidInput
  - notAuthorized
  - notFound
  - invalidStatus
  ### Not enough ingredient stock for an ordered article's composition.
  - insufficientStock
  ### Table already has an open order and building.tableMultiOrder is false.
  - tableOccupied
  ### Building does not allow appending articles to an existing order.
  - appendNotAllowed
  ### Employee access profile does not allow this action.
  - permissionDenied
  ### A reservation has started and staff have not confirmed arrival.
  - reservationHeld
  ### Venue turned off customer-app ordering.
  - customerOrderingDisabled
