name: backoffice
description: Sip Sync platform administration.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.12.2"

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  get_it: ^8.2.0
  go_router: ^18.0.1
  google_fonts: ^8.1.0
  riverpod_annotation: ^3.0.3
  intl: any
  sip_sync_client:
    path: ../sip_sync_client
  serverpod_flutter: 4.0.4
  serverpod_auth_idp_flutter: 4.0.4
  # 10.x only. Declared here so the workspace root stays free of Flutter packages.
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shadcn_ui: ^0.57.1
  flutter_spinkit: ^5.2.2

dev_dependencies:
  build_runner: ^2.4.15
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.0.1
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config.json
    - assets/branding/logo.png
