name: managment
description: Sip Sync operations app for owners and employees.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  get_it: ^8.2.0
  go_router: ^18.0.1
  google_fonts: ^8.1.0
  riverpod_annotation: ^3.0.3
  intl: any
  sip_sync_client:
    path: ../sip_sync_client
  serverpod_flutter: 4.0.0
  serverpod_auth_idp_flutter: 4.0.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.0.1
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config.json
